<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>OpenTree — monitoring d'architecture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ui: "Space Grotesk", system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: var(--ui);
      }
      body {
        background: #11141a;
      }

      /* ============ THEME TOKENS ============ */
      body[data-theme="parchment"] {
        --bg1: #f3eee1;
        --bg2: #e2d9c4;
        --bg3: #d8cdb2;
        --ink: #3a3326;
        --ink-soft: #6f6552;
        --hair: rgba(120, 103, 74, 0.2);
        --panel: rgba(255, 253, 246, 0.8);
        --panel-solid: #fbf8f0;
        --accent: #c2662f;
        --accent-ink: #fff;
        --chip: rgba(255, 255, 255, 0.7);
        --shadow: 0 10px 34px rgba(86, 70, 40, 0.16);
        --lbl-bg: #fdfbf5;
        --lbl-ink: #3a3326;
        --lbl-shadow: 0 2px 10px rgba(80, 64, 36, 0.16);
        --ok: #3f8a4f;
        --bad: #bb4138;
        --warn: #c79038;
      }

      #stage {
        position: fixed;
        inset: 0;
        background: radial-gradient(
          120% 120% at 50% 38%,
          var(--bg1) 0%,
          var(--bg2) 58%,
          var(--bg3) 100%
        );
        transition: background 0.5s ease;
        cursor: grab;
      }
      #stage:active {
        cursor: grabbing;
      }
      canvas {
        display: block;
      }

      /* ============ LABELS ============ */
      .label-layer {
        z-index: 2;
      }
      .node-label {
        pointer-events: auto;
        cursor: pointer;
        transform: translate(-50%, -130%);
        background: var(--lbl-bg);
        color: var(--lbl-ink);
        padding: 2px 6px 3px;
        border-radius: 6px;
        white-space: nowrap;
        box-shadow: var(--lbl-shadow);
        border: 1px solid var(--hair);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        transition:
          opacity 0.15s,
          transform 0.12s;
        backdrop-filter: blur(6px);
      }

      .node-label .lbl-name {
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      .node-label[data-depth="1"] .lbl-name {
        font-size: 10.5px;
      }
      .node-label[data-depth="2"] .lbl-name {
        font-size: 9px;
        opacity: 0.9;
      }
      .node-label[data-depth="3"] .lbl-name {
        font-size: 8px;
        opacity: 0.8;
      }
      .node-label .lbl-bar {
        width: 14px;
        height: 2px;
        border-radius: 2px;
        background: var(--c);
      }
      .node-label:hover {
        transform: translate(-50%, -140%) scale(1.04);
      }
      .node-label.hidden {
        display: none;
      }

      /* ============ ISLAND PLATES (socles) ============ */
      .island-plate {
        pointer-events: auto;
        cursor: pointer;
        transform: translate(-50%, 0);
        background: var(--lbl-bg);
        color: var(--lbl-ink);
        border: 1px solid var(--hair);
        border-radius: 999px;
        padding: 5px 12px 5px 9px;
        box-shadow: var(--lbl-shadow);
        display: flex;
        flex-direction: row;
        gap: 7px;
        align-items: center;
        backdrop-filter: blur(8px);
        transition:
          border-color 0.15s,
          transform 0.15s,
          opacity 0.2s;
        font-family: var(--mono);
        white-space: nowrap;
      }
      .island-plate:hover {
        border-color: var(--accent);
        transform: translate(-50%, 0) scale(1.05);
      }
      .island-plate.active {
        border-color: var(--accent);
        box-shadow:
          0 0 0 2px color-mix(in oklab, var(--accent) 40%, transparent),
          var(--lbl-shadow);
      }
      .island-plate .ip-title {
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      .island-plate.is-host .ip-title {
        font-size: 12.5px;
      }
      .ip-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
        display: inline-block;
      }
      .ip-dot.st-healthy,
      .ip-dot.st-ok {
        background: var(--ok);
        box-shadow: 0 0 6px var(--ok);
      }
      .ip-dot.st-unhealthy {
        background: var(--bad);
        box-shadow: 0 0 6px var(--bad);
        animation: blink 1.6s infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.35;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ip-dot.st-unhealthy {
          animation: none;
        }
      }

      /* ============ ISLAND INFO CARD ============ */
      #island-card {
        position: fixed;
        left: 50%;
        bottom: 22px;
        z-index: 21;
        width: 460px;
        max-width: 92vw;
        background: var(--panel-solid);
        border: 1px solid var(--hair);
        border-radius: 16px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.2);
        color: var(--ink);
        padding: 16px 18px 16px;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
        transform: translateX(-50%) translateY(16px) scale(0.985);
        transition:
          opacity 0.22s cubic-bezier(0.4, 0, 0.1, 1),
          transform 0.22s cubic-bezier(0.4, 0, 0.1, 1);
      }
      #island-card.show {
        opacity: 1;
        pointer-events: auto;
        transform: translateX(-50%) translateY(0) scale(1);
      }
      #island-card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        height: 3px;
        background: var(--ic-accent, var(--accent));
        opacity: 0.9;
      }
      .ic-head {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .ic-head .ic-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: none;
      }
      .ic-head .ic-dot.st-healthy,
      .ic-head .ic-dot.st-ok {
        background: var(--ok);
        box-shadow: 0 0 7px var(--ok);
      }
      .ic-head .ic-dot.st-unhealthy {
        background: var(--bad);
        box-shadow: 0 0 7px var(--bad);
        animation: blink 1.6s infinite;
      }
      .ic-name {
        font-family: var(--mono);
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.3px;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ic-kind {
        font-size: 9.5px;
        text-transform: uppercase;
        letter-spacing: 1.3px;
        color: var(--ink-soft);
        border: 1px solid var(--hair);
        border-radius: 20px;
        padding: 3px 9px;
      }
      #ic-close {
        width: 26px;
        height: 26px;
        flex: none;
        border: 1px solid var(--hair);
        background: transparent;
        color: var(--ink);
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
      }
      #ic-close:hover {
        color: var(--accent);
        border-color: var(--accent);
      }
      .ic-status {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 13px 0 4px;
      }
      .ic-badge {
        font-size: 11px;
        font-weight: 600;
        padding: 3px 11px;
        border-radius: 20px;
        letter-spacing: 0.2px;
      }
      .ic-badge.st-healthy,
      .ic-badge.st-ok {
        color: #4f7d4f;
        background: color-mix(in oklab, var(--ok) 16%, transparent);
      }
      .ic-badge.st-unhealthy {
        color: var(--bad);
        background: color-mix(in oklab, var(--bad) 16%, transparent);
      }
      .ic-up {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--ink-soft);
      }
      .ic-sec {
        font-size: 9.5px;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--ink-soft);
        margin: 16px 0 8px;
      }
      .ic-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
        gap: 1px;
        background: var(--hair);
        border: 1px solid var(--hair);
        border-radius: 11px;
        overflow: hidden;
      }
      .ic-tile {
        background: var(--panel-solid);
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .ic-tile .t-k {
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.9px;
        color: var(--ink-soft);
      }
      .ic-tile .t-v {
        font-family: var(--mono);
        font-size: 13.5px;
        font-weight: 600;
        color: var(--ink);
        white-space: nowrap;
      }
      .ic-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .ic-chip {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink);
        background: var(--chip);
        border: 1px solid var(--hair);
        border-radius: 8px;
        padding: 4px 9px;
      }
      .ic-actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      .ic-btn {
        flex: 1;
        font-family: var(--ui);
        font-size: 12.5px;
        font-weight: 500;
        padding: 9px;
        border-radius: 9px;
        cursor: pointer;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: var(--accent-ink);
        transition: filter 0.12s;
      }
      .ic-btn.ghost {
        background: transparent;
        color: var(--ink);
        border-color: var(--hair);
      }
      .ic-btn:hover {
        filter: brightness(1.05);
      }
      .ic-btn.ghost:hover {
        border-color: var(--accent);
        color: var(--accent);
        filter: none;
      }

      /* ============ NODE BUBBLE (intersection counts + file text) ============ */
      #node-bubble {
        position: fixed;
        z-index: 22;
        max-width: 440px;
        min-width: 196px;
        background: var(--panel-solid);
        border: 1px solid var(--hair);
        border-radius: 12px;
        box-shadow: 0 14px 42px rgba(0, 0, 0, 0.18);
        color: var(--ink);
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
        transform: scale(0.97);
        transform-origin: top left;
        transition:
          opacity 0.16s cubic-bezier(0.4, 0, 0.1, 1),
          transform 0.16s cubic-bezier(0.4, 0, 0.1, 1);
      }
      #node-bubble.show {
        opacity: 1;
        pointer-events: auto;
        transform: scale(1);
      }
      .nb-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 11px 10px 12px;
        border-bottom: 1px solid var(--hair);
      }
      .nb-dot {
        width: 9px;
        height: 9px;
        border-radius: 3px;
        flex: none;
      }
      .nb-name {
        font-family: var(--mono);
        font-size: 12.5px;
        font-weight: 600;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .nb-ext {
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--ink-soft);
        border: 1px solid var(--hair);
        border-radius: 6px;
        padding: 2px 6px;
      }
      #nb-close {
        width: 22px;
        height: 22px;
        flex: none;
        border: 1px solid var(--hair);
        background: transparent;
        color: var(--ink);
        border-radius: 7px;
        cursor: pointer;
        font-size: 13px;
        line-height: 1;
      }
      #nb-close:hover {
        color: var(--accent);
        border-color: var(--accent);
      }
      .nb-counts {
        display: flex;
        gap: 1px;
        background: var(--hair);
      }
      .nb-counts .nb-stat {
        flex: 1;
        background: var(--panel-solid);
        padding: 13px 15px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .nb-stat .s-v {
        font-family: var(--mono);
        font-size: 22px;
        font-weight: 600;
        line-height: 1;
        color: var(--ink);
      }
      .nb-stat .s-k {
        font-size: 10.5px;
        color: var(--ink-soft);
      }
      .nb-foot {
        padding: 9px 12px 11px;
      }
      .nb-iso {
        font-family: var(--ui);
        font-size: 11.5px;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--hair);
        border-radius: 8px;
        padding: 7px 10px;
        cursor: pointer;
        width: 100%;
        transition: 0.12s;
      }
      .nb-iso:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      #node-bubble pre.nb-code {
        margin: 0;
        max-height: 300px;
        max-width: 440px;
        overflow: auto;
        padding: 12px 14px;
        background: var(--bg2);
      }
      #node-bubble pre.nb-code code {
        font-family: var(--mono);
        font-size: 11.5px;
        line-height: 1.62;
        color: var(--ink);
        white-space: pre;
      }
      .nb-bin {
        padding: 22px 16px;
        text-align: center;
      }
      .nb-bin .b-ext {
        font-family: var(--mono);
        font-size: 22px;
        font-weight: 600;
        color: var(--accent);
      }
      .nb-bin .b-note {
        font-size: 11.5px;
        color: var(--ink-soft);
        margin-top: 6px;
      }

      /* ============ TOP BAR ============ */
      .topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        pointer-events: none;
      }
      .topbar > * {
        pointer-events: auto;
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
        color: var(--ink);
      }
      .brand .logo {
        font-family: var(--mono);
        font-weight: 600;
        font-size: 16px;
        letter-spacing: 1px;
        color: var(--accent);
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .brand .logo svg {
        width: 17px;
        height: 17px;
      }
      .brand .sub {
        font-size: 12px;
        color: var(--ink-soft);
        letter-spacing: 0.3px;
      }
      .spacer {
        flex: 1;
      }

      .search-wrap {
        position: relative;
        pointer-events: auto;
      }
      #search {
        width: 240px;
        font-family: var(--ui);
        font-size: 13px;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--hair);
        border-radius: 10px;
        padding: 9px 32px 9px 32px;
        outline: none;
        backdrop-filter: blur(10px);
        box-shadow: var(--shadow);
        transition:
          border-color 0.2s,
          width 0.2s;
      }
      #search:focus {
        border-color: var(--accent);
        width: 280px;
      }
      #search::placeholder {
        color: var(--ink-soft);
      }
      .search-wrap .si {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        width: 15px;
        height: 15px;
        color: var(--ink-soft);
        pointer-events: none;
      }
      #search-clear {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        width: 18px;
        height: 18px;
        border: none;
        background: var(--hair);
        color: var(--ink);
        border-radius: 50%;
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        line-height: 1;
      }
      #search-clear.show {
        display: flex;
      }

      .seg {
        display: flex;
        background: var(--panel);
        border: 1px solid var(--hair);
        border-radius: 10px;
        padding: 3px;
        gap: 2px;
        backdrop-filter: blur(10px);
        box-shadow: var(--shadow);
      }

      .icon-btn {
        width: 38px;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--panel);
        border: 1px solid var(--hair);
        border-radius: 10px;
        cursor: pointer;
        color: var(--ink);
        backdrop-filter: blur(10px);
        box-shadow: var(--shadow);
      }
      .icon-btn:hover {
        color: var(--accent);
      }
      .icon-btn.busy {
        opacity: 0.5;
        pointer-events: none;
      }
      .icon-btn svg {
        width: 17px;
        height: 17px;
      }

      /* ============ SETTINGS POPOVER ============ */
      #settings {
        position: fixed;
        top: 64px;
        right: 18px;
        z-index: 11;
        width: 260px;
        background: var(--panel-solid);
        border: 1px solid var(--hair);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 16px;
        color: var(--ink);
        opacity: 0;
        transform: translateY(-8px) scale(0.98);
        pointer-events: none;
        transition: 0.18s;
      }
      #settings.open {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
      #settings h4 {
        margin: 0 0 12px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--ink-soft);
      }
      #settings h4 + h4 {
        margin-top: 16px;
      }
      .set-row {
        margin-bottom: 14px;
      }
      .set-row label {
        display: flex;
        justify-content: space-between;
        font-size: 12.5px;
        margin-bottom: 6px;
      }
      .set-row label .val {
        color: var(--accent);
        font-family: var(--mono);
        font-size: 11px;
      }
      .set-row input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }
      .set-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12.5px;
        margin-bottom: 10px;
      }
      .set-toggle input {
        accent-color: var(--accent);
        width: 16px;
        height: 16px;
      }

      /* ============ ARCHITECTURE POPOVER ============ */
      #arch-panel {
        position: fixed;
        top: 64px;
        right: 18px;
        z-index: 11;
        width: 264px;
        background: var(--panel-solid);
        border: 1px solid var(--hair);
        border-radius: 14px;
        padding: 14px;
        box-shadow: var(--shadow);
        color: var(--ink);
        opacity: 0;
        transform: translateY(-8px) scale(0.98);
        pointer-events: none;
        transition: 0.18s;
      }
      #arch-panel.open {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
      .legend .lg-title {
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--ink-soft);
        margin-bottom: 9px;
        padding-left: 2px;
      }
      #legend-items {
        display: flex;
        flex-direction: column;
        gap: 1px;
        max-height: 58vh;
        overflow-y: auto;
      }
      .lg-sec {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1.1px;
        color: var(--ink-soft);
        padding: 7px 7px 3px;
      }
      .lg-sec:first-child {
        padding-top: 1px;
      }
      .legend-chip {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        text-align: left;
        background: transparent;
        border: none;
        padding: 5px 7px;
        border-radius: 8px;
        cursor: pointer;
        color: var(--ink);
        font-family: var(--ui);
        font-size: 12.5px;
        transition: background 0.12s;
      }
      .legend-chip:hover {
        background: var(--hair);
      }
      .legend-chip .dot {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        flex: none;
      }
      .legend-chip .lg-name {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .legend-chip .lg-count {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--ink-soft);
      }

      /* ============ HUD bottom-right ============ */
      .hud {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }
      .hint {
        font-size: 11.5px;
        color: var(--ink-soft);
        background: var(--panel);
        border: 1px solid var(--hair);
        border-radius: 9px;
        padding: 7px 11px;
        backdrop-filter: blur(10px);
        display: flex;
        gap: 12px;
      }
      .hint b {
        color: var(--ink);
        font-weight: 600;
      }
      #count {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--hair);
        border-radius: 9px;
        padding: 7px 12px;
        backdrop-filter: blur(10px);
      }

      /* ============ ISOLATE CHIP ============ */
      #isolate-chip {
        position: fixed;
        top: 64px;
        left: 50%;
        transform: translateX(-50%) translateY(-8px);
        z-index: 10;
        display: none;
        align-items: center;
        gap: 10px;
        background: var(--accent);
        color: var(--accent-ink);
        padding: 7px 9px 7px 14px;
        border-radius: 10px;
        box-shadow: var(--shadow);
        font-size: 12.5px;
        opacity: 0;
        transition: 0.18s;
      }
      #isolate-chip.show {
        display: flex;
        opacity: 1;
        transform: translateX(-50%);
      }
      #isolate-chip b {
        font-weight: 600;
      }
      #isolate-clear {
        width: 20px;
        height: 20px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background: rgba(0, 0, 0, 0.18);
        color: inherit;
        font-size: 13px;
        line-height: 1;
      }

      /* ============ USAGE TAGS + SPARKLINES ============ */
      .u-tag {
        font-family: var(--mono);
        font-size: 10px;
        padding: 1.5px 8px;
        border-radius: 20px;
        white-space: nowrap;
      }
      .u-tag.u0 {
        color: var(--ink-soft);
        background: var(--hair);
      }
      .u-tag.u1 {
        color: var(--warn);
        background: color-mix(in oklab, var(--warn) 14%, transparent);
      }
      .u-tag.u2 {
        color: var(--ok);
        background: color-mix(in oklab, var(--ok) 14%, transparent);
      }
      .u-tag.u3 {
        color: var(--accent);
        background: color-mix(in oklab, var(--accent) 16%, transparent);
      }
      .spark {
        display: block;
      }
      .spark .sp-line {
        fill: none;
        stroke: var(--accent);
        stroke-width: 1.6;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .spark .sp-area {
        fill: color-mix(in oklab, var(--accent) 14%, transparent);
        stroke: none;
      }
      .spark .sp-dot {
        fill: var(--accent);
      }

      /* ============ TOOLTIP ============ */
      #tooltip {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 30;
        pointer-events: none;
        background: var(--panel-solid);
        border: 1px solid var(--hair);
        border-radius: 10px;
        padding: 9px 12px 10px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 4px;
        opacity: 0;
        transition: opacity 0.12s;
        max-width: 300px;
      }
      #tooltip.show {
        opacity: 1;
      }
      #tooltip .tt-name {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ink);
      }
      #tooltip .tt-meta {
        font-size: 11px;
        color: var(--ink-soft);
        font-family: var(--mono);
      }
      #tooltip .tt-usage {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 2px;
      }
      #tooltip .tt-uses {
        font-size: 11px;
        color: var(--ink);
        font-family: var(--mono);
      }
      #tooltip .tt-dates {
        font-size: 10.5px;
        color: var(--ink-soft);
        font-family: var(--mono);
      }

      /* ============ DETAIL PANEL ============ */
      #detail {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        width: 392px;
        max-width: 86vw;
        background: var(--panel-solid);
        border-left: 1px solid var(--hair);
        box-shadow: -18px 0 50px rgba(0, 0, 0, 0.18);
        transform: translateX(102%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.1, 1);
        display: flex;
        flex-direction: column;
        color: var(--ink);
      }
      #detail.show {
        transform: none;
      }
      .d-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 18px 0;
      }
      .d-head .d-tag {
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 1.4px;
        color: var(--ink-soft);
      }
      #d-close {
        width: 28px;
        height: 28px;
        border: 1px solid var(--hair);
        background: transparent;
        color: var(--ink);
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
      }
      #d-close:hover {
        color: var(--accent);
      }
      .d-body {
        padding: 14px 18px 18px;
        overflow-y: auto;
        flex: 1;
      }
      .d-file {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 4px;
      }
      .d-file .d-dot {
        width: 11px;
        height: 11px;
        border-radius: 4px;
      }
      .d-file .d-name {
        font-size: 17px;
        font-weight: 600;
        word-break: break-all;
      }
      .d-crumb {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-soft);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px;
        margin-bottom: 14px;
      }
      .d-crumb i {
        opacity: 0.4;
        margin: 0 1px;
        font-style: normal;
      }
      .d-usage {
        border: 1px solid var(--hair);
        border-radius: 10px;
        padding: 11px 12px 9px;
        margin-bottom: 14px;
        background: var(--chip);
      }
      .d-usage .du-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 7px;
      }
      .d-usage .k {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--ink-soft);
      }
      .d-usage .spark {
        width: 100%;
      }
      .d-usage .du-stats {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-soft);
        margin-top: 6px;
      }
      .d-usage .du-stats b {
        color: var(--ink);
        font-weight: 600;
      }
      .d-meta {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        background: var(--hair);
        border: 1px solid var(--hair);
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 16px;
      }
      .d-meta .m {
        background: var(--panel-solid);
        padding: 9px 12px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .d-meta .k {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--ink-soft);
      }
      .d-meta .v {
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .git {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11.5px;
        padding: 1px 8px;
        border-radius: 20px;
        font-family: var(--mono);
      }
      .git::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .git.clean {
        color: #5a8f5a;
        background: rgba(90, 143, 90, 0.13);
      }
      .git.modified {
        color: #c79038;
        background: rgba(199, 144, 56, 0.15);
      }
      .git.added {
        color: #4a8fb5;
        background: rgba(74, 143, 181, 0.15);
      }
      .git.untracked {
        color: #b06;
        background: rgba(187, 0, 102, 0.12);
      }
      pre.code {
        margin: 0;
        background: var(--bg2);
        border: 1px solid var(--hair);
        border-radius: 10px;
        padding: 14px;
        overflow: auto;
        max-height: 300px;
      }
      pre.code code {
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.65;
        color: var(--ink);
        white-space: pre;
      }
      .bin-card {
        background: var(--bg2);
        border: 1px dashed var(--hair);
        border-radius: 12px;
        padding: 30px 18px;
        text-align: center;
      }
      .bin-card .bin-ext {
        font-family: var(--mono);
        font-size: 26px;
        font-weight: 600;
        color: var(--accent);
      }
      .bin-card .bin-meta {
        font-size: 13px;
        margin-top: 6px;
      }
      .bin-card .bin-note {
        font-size: 12px;
        color: var(--ink-soft);
        margin-top: 10px;
      }
      .d-actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      .d-btn {
        flex: 1;
        font-family: var(--ui);
        font-size: 12.5px;
        font-weight: 500;
        padding: 9px;
        border-radius: 9px;
        cursor: pointer;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: var(--accent-ink);
      }
      .d-btn.ghost {
        background: transparent;
        color: var(--ink);
        border-color: var(--hair);
      }
      .d-btn:hover {
        filter: brightness(1.05);
      }

      /* ============ TIMELINE ============ */

      #stage[data-space],
      #stage[data-space] canvas {
        cursor: grab !important;
      }
      #stage[data-space]:active,
      #stage[data-space] canvas:active {
        cursor: grabbing !important;
      }

      @media (max-width: 900px) {
        #search {
          width: 150px;
        }
        #search:focus {
          width: 180px;
        }
      }
    </style>
  </head>
  <body data-theme="parchment">
    <div id="stage" data-screen-label="Inspector 3D"></div>
    <div
      id="loading"
      style="
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--mono);
        font-size: 13px;
        color: var(--ink-soft);
        background: var(--bg1);
        transition: opacity 0.3s;
      "
    >
      Lecture de l'architecture…
    </div>

    <div class="topbar">
      <div class="brand">
        <span class="logo">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
          </svg>
          OPENTREE
        </span>
      </div>
      <div class="spacer"></div>
      <div class="search-wrap">
        <svg
          class="si"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="11" cy="11" r="7" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <input
          id="search"
          type="text"
          placeholder="Rechercher un fichier, un dossier…  ( / )"
          autocomplete="off"
        />
        <button id="search-clear">×</button>
      </div>
      <button
        class="icon-btn"
        id="refresh-btn"
        title="Mettre à jour les données"
      >
        ⟳
      </button>
      <button class="icon-btn" id="reset-view" title="Recentrer (Échap)">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
          <path d="M3 3v5h5" />
        </svg>
      </button>
      <button class="icon-btn" id="arch-btn" title="Architecture">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polygon points="12 2 2 7 12 12 22 7 12 2" />
          <polyline points="2 17 12 22 22 17" />
          <polyline points="2 12 12 17 22 12" />
        </svg>
      </button>
      <button class="icon-btn" id="gear" title="Réglages">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 2.6 15H2.5a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4 8.6l-.1-.1a2 2 0 0 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9 6.6 1.6 1.6 0 0 0 10 5V4.9a2 2 0 1 1 4 0V5a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.6 1.6 0 0 0 21.4 11h.1a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"
          />
        </svg>
      </button>
    </div>

    <div id="settings">
      <h4>Vue</h4>
      <div class="set-row">
        <label
          >Halo des branches <span class="val" id="val-glow">100%</span></label
        ><input
          type="range"
          id="opt-glow"
          min="0"
          max="2"
          step="0.05"
          value="1"
        />
      </div>
      <div class="set-row">
        <label>Courbure <span class="val" id="val-curve">100%</span></label
        ><input
          type="range"
          id="opt-curve"
          min="0"
          max="2"
          step="0.05"
          value="1"
        />
      </div>
      <div class="set-row">
        <label
          >Taille des fichiers
          <span class="val" id="val-fileSize">100%</span></label
        ><input
          type="range"
          id="opt-fileSize"
          min="0.4"
          max="2.2"
          step="0.05"
          value="1"
        />
      </div>
      <div class="set-toggle">
        <label for="opt-labels">Étiquettes des branches</label
        ><input type="checkbox" id="opt-labels" checked />
      </div>
      <div class="set-row">
        <label
          >Niveau d'affichage des étiquettes
          <span class="val" id="val-labelDepth">Automatique</span></label
        ><input
          type="range"
          id="opt-labelDepth"
          min="1"
          max="7"
          step="1"
          value="7"
        />
      </div>
      <div class="set-toggle">
        <label for="opt-plates">Socles des conteneurs</label
        ><input type="checkbox" id="opt-plates" checked />
      </div>
      <div class="set-toggle">
        <label for="opt-rotate">Rotation automatique</label
        ><input type="checkbox" id="opt-rotate" />
      </div>
    </div>

    <div id="isolate-chip">
      <span>Branche isolée · <b id="isolate-name"></b></span>
      <button id="isolate-clear">×</button>
    </div>

    <div class="legend" id="arch-panel">
      <div class="lg-title">Architecture · cliquer pour isoler</div>
      <div id="legend-items"></div>
    </div>

    <div class="hud">
      <div id="count"></div>
      <div class="hint">
        <span><b>Glisser</b> tourner</span><span><b>Molette</b> zoom</span
        ><span><b>Clic gauche</b> stats</span
        ><span><b>Clic droit</b> contenu</span>
      </div>
    </div>

    <div id="tooltip"></div>

    <aside id="detail">
      <div class="d-head">
        <span class="d-tag">Fichier</span><button id="d-close">×</button>
      </div>
      <div class="d-body"></div>
    </aside>

    <aside id="island-card"></aside>
    <div id="node-bubble"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/": "./vendor/addons/"
        }
      }
    </script>
    <script type="module" src="main-v2.js"></script>
  </body>
</html>
